name: Android Shell APK

on:
  push:
    paths:
      - "apps/android_shell/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: "URL of the deployed Cyber AI dashboard the APK should load"
        required: false
        default: "https://cyber-ai-system.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android_shell

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest GitHub-hosted runners ship a pre-installed, license-
      # accepted Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT already set) —
      # no separate setup-android step needed, and that action was failing
      # here on non-interactive license acceptance.
      - name: Confirm Android SDK is available
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Assemble debug APK
        env:
          CYBERAI_DASHBOARD_URL: ${{ github.event.inputs.dashboard_url || 'https://cyber-ai-system.vercel.app' }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK (unsigned)
        env:
          CYBERAI_DASHBOARD_URL: ${{ github.event.inputs.dashboard_url || 'https://cyber-ai-system.vercel.app' }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyberai-android-shell-apks
          if-no-files-found: error
          path: |
            apps/android_shell/app/build/outputs/apk/debug/*.apk
            apps/android_shell/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish APK to a GitHub Release
        if: github.ref == 'refs/heads/claude/cyber-ai-foundation-upar86' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: Cyber AI System — Android APK (latest)
          body: |
            Automatically built Android APK for the Cyber AI System dashboard shell.
            - `*-debug.apk`: installable directly, for testing.
            - `*-release-unsigned.apk`: unsigned release build; sign before distributing widely.

            Built from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: |
            apps/android_shell/app/build/outputs/apk/debug/*.apk
            apps/android_shell/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
