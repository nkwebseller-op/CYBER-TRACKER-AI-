services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly-change-me}
      POSTGRES_DB: cyberai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY in the environment}
      DATABASE_URL: postgresql+asyncpg://cyberai:${POSTGRES_PASSWORD:-devonly-change-me}@postgres:5432/cyberai
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://api:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
